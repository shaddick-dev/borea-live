[workspace]
members = ["crates/*", "tests/vm"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
borea-catalog = { path = "crates/borea-catalog" }
borea-core = { path = "crates/borea-core" }
borea-locale = { path = "crates/borea-locale" }
borea-net = { path = "crates/borea-net" }
borea-disk = { path = "crates/borea-disk" }
borea-backend = { path = "crates/borea-backend" }
borea-job = { path = "crates/borea-job" }
borea-exec = { path = "crates/borea-exec" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version="1.0", features=["raw_value"] }
toml = "0.9"
thiserror = "2"
zeroize = "1.8"
sha2 = "0.10.9"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
nix = { version = "0.31", features = ["user", "socket", "mount", "sched", "fs", "signal"] }
borea-http = { path = "crates/borea-http" }

borea-platform = { path = "crates/borea-platform" }
rustix = { version = "1.1", features = ["process"] }
