# cargo-deny policy (CI runs `cargo deny check advisories sources`).
# Every ignore names who pulls the crate in, why it cannot be fixed here yet,
# and what removes the need for it. Revisit them whenever eframe or zbus moves.

[advisories]
ignore = [
    # Slint 1.11 is the last release compatible with the backend's zbus 5.5
    # pin. Slint 1.14 would change that pin and still uses rustybuzz/ttf-parser;
    # current Slint 1.18 requires zbus >=5.14 (Rust 1.87). The four advisories
    # below report maintenance status, not a
    # patched vulnerability. Retire these exceptions when Slint can move to
    # its newer text/menu/accessibility stack without changing backend MSRV.
    # paste: Slint -> accesskit_windows; also image -> exr/pulp and rav1e.
    { id = "RUSTSEC-2024-0436", reason = "Slint 1.11 accesskit_windows and image codec macros require paste; no same-package upgrade; revisit on Slint/image upgrade" },
    # proc-macro-error: Slint -> muda -> GTK/glib build-time macros.
    { id = "RUSTSEC-2024-0370", reason = "Slint 1.11 declared native-menu chain pins glib-macros/proc-macro-error 1; revisit when compatible Slint drops that chain" },
    # rustybuzz: Slint text shaping and its resvg/usvg image renderer.
    { id = "RUSTSEC-2026-0206", reason = "Slint 1.11 and resvg/usvg require rustybuzz; harfrust is not API-compatible; revisit with compatible newer Slint" },
    # ttf-parser: Slint/fontdb/fontdue/usvg and Winit's Adwaita font stack.
    { id = "RUSTSEC-2026-0192", reason = "Slint 1.11 font stack requires ttf-parser; skrifa is not API-compatible; revisit on Slint/Winit font-stack upgrade" },
    # quick-xml 0.38: quadratic duplicate-attribute check and unbounded namespace
    # allocation (denial of service only). Pulled in only by the GUI's
    # accessibility stack: eframe 0.37 -> accesskit_unix -> atspi-common ->
    # zbus-lockstep 0.5 -> zbus_xml 5 -> quick-xml ^0.38. The fixed release
    # needs zbus_xml 6, which nothing in that chain accepts yet. Remove when
    # eframe/accesskit move to it.
    { id = "RUSTSEC-2026-0194", reason = "GUI accessibility chain pins quick-xml ^0.38 via zbus_xml 5; DoS only; no compatible fix" },
    { id = "RUSTSEC-2026-0195", reason = "GUI accessibility chain pins quick-xml ^0.38 via zbus_xml 5; DoS only; no compatible fix" },
    # zvariant, zvariant_derive and zbus_names are marked unmaintained with no
    # safe upgrade; every zbus 5 release depends on them. zbus is how the
    # backend and GUI talk to NetworkManager and logind. Replace when zbus
    # publishes a successor.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; required by every zbus 5; no successor yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; required by every zbus 5; no successor yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; required by every zbus 5; no successor yet" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
