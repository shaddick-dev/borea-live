# cargo-deny policy (CI runs `cargo deny check advisories sources`).
# Every ignore names who pulls the crate in, why it cannot be fixed here yet,
# and what removes the need for it. Revisit them whenever Iced, Winit or zbus moves.

[advisories]
ignore = [
    # Iced 0.14's SVG renderer uses resvg/usvg 0.45, which requires rustybuzz.
    # This is an unmaintained advisory; harfrust is not a drop-in replacement.
    # Remove when Iced upgrades resvg/usvg's shaping stack.
    { id = "RUSTSEC-2026-0206", reason = "Iced SVG renderer -> resvg/usvg 0.45 requires rustybuzz; remove on upstream shaping-stack upgrade" },
    # fontdb/usvg and Winit's Adwaita decoration stack require ttf-parser.
    { id = "RUSTSEC-2026-0192", reason = "Iced SVG/font loading and Winit require ttf-parser; skrifa is not API-compatible; remove on upstream font-stack upgrade" },
    # zvariant, zvariant_derive and zbus_names are marked unmaintained with no
    # safe upgrade; every zbus 5 release depends on them. zbus is how the
    # backend and GUI talk to NetworkManager and logind. Replace when zbus
    # publishes a successor.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; required by every zbus 5; no successor yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; required by every zbus 5; no successor yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; required by every zbus 5; no successor yet" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
