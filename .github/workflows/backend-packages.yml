name: Upstream backend package audit
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      distro:
        type: choice
        options: [all, arch, debian, fedora, opensuse]
        default: all
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path backend/Cargo.toml --locked --release -p borea-backend --bin borea-verify
      - uses: actions/upload-artifact@v4
        with:
          name: borea-verify
          path: backend/target/release/borea-verify
  native:
    needs: inventory
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(inputs.distro == 'arch' && '["arch"]' || inputs.distro == 'debian' && '["debian"]' || inputs.distro == 'fedora' && '["fedora"]' || inputs.distro == 'opensuse' && '["opensuse"]' || '["arch","debian","fedora","opensuse"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: borea-verify
          path: verify-bin
      - run: chmod 755 verify-bin/borea-verify
      - name: Query signed upstream package metadata
        env:
          BOREA_AUDIT_DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          case "$BOREA_AUDIT_DISTRO" in
            arch) BOREA_AUDIT_IMAGE=archlinux:base-devel ;;
            debian) BOREA_AUDIT_IMAGE=debian:trixie ;;
            fedora) BOREA_AUDIT_IMAGE=fedora:44 ;;
            opensuse) BOREA_AUDIT_IMAGE=opensuse/tumbleweed:latest ;;
          esac
          docker run --rm \
            --mount type=bind,src="$PWD/verify-bin",dst=/verify,readonly \
            --mount type=bind,src="$PWD/backend/tests/packages",dst=/audit,readonly \
            -e BOREA_AUDIT_DISTRO "$BOREA_AUDIT_IMAGE" \
            /bin/bash /audit/native.sh 2>&1 | tee "package-audit-$BOREA_AUDIT_DISTRO.log"
      - name: Expose upstream failures in the job annotations
        if: failure()
        run: |
          for log in package-audit-*.log; do
            if [ -f "$log" ]; then
              failures=$(grep '^FAIL ' "$log" || tail -n 8 "$log")
              failures=${failures//%/%25}
              failures=${failures//$'\r'/%0D}
              failures=${failures//$'\n'/%0A}
              echo "::error::$failures"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-audit-${{ matrix.distro }}
          path: package-audit-*.log
  external:
    needs: inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: borea-verify
          path: verify-bin
      - run: chmod 755 verify-bin/borea-verify
      - name: Check Flathub, AUR and upstream AppImage catalog entries
        run: |
          set -euo pipefail
          ./verify-bin/borea-verify arch --check-external 2>&1 | tee external-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-audit
          path: external-audit.log
