name: CachyOS probe
on:
  pull_request:
    paths: [tests/probe/cachyos.sh, .github/workflows/cachyos-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm --needed git >/dev/null
      - uses: actions/checkout@v7
      - run: bash tests/probe/cachyos.sh
