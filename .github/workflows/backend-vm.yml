name: Disposable backend install and boot
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      distro:
        type: choice
        options: [all, arch, debian, fedora, opensuse]
        default: all
      layout:
        type: choice
        options: [whole, alongside, both]
        default: whole
      secure_boot:
        type: choice
        options: ['0', '1', both]
        default: '0'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build native test drivers and static target helper
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          cargo build --manifest-path backend/Cargo.toml --locked --release -p borea-vm-test --bins
          cargo build --manifest-path backend/Cargo.toml --locked --release -p borea-exec --bin borea-firstboot --target x86_64-unknown-linux-musl
          mkdir vm-bin
          cp backend/target/release/borea-vm-test backend/target/release/borea-vm-runner vm-bin/
          cp backend/target/x86_64-unknown-linux-musl/release/borea-firstboot vm-bin/
      - uses: actions/upload-artifact@v4
        with:
          name: vm-binaries
          path: vm-bin/*
          retention-days: 1
  install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        distro: ${{ fromJSON(inputs.distro == 'arch' && '["arch"]' || inputs.distro == 'debian' && '["debian"]' || inputs.distro == 'fedora' && '["fedora"]' || inputs.distro == 'opensuse' && '["opensuse"]' || '["arch","debian","fedora","opensuse"]') }}
        layout: ${{ fromJSON(inputs.layout == 'both' && '["whole","alongside"]' || inputs.layout == 'alongside' && '["alongside"]' || '["whole"]') }}
        secure_boot: ${{ fromJSON(inputs.secure_boot == 'both' && '["0","1"]' || inputs.secure_boot == '1' && '["1"]' || '["0"]') }}
        exclude:
          - distro: arch
            secure_boot: '1'
    env:
      BOREA_TEST_DISTRO: ${{ matrix.distro }}
      BOREA_TEST_LAYOUT: ${{ matrix.layout }}
      BOREA_TEST_SECURE_BOOT: ${{ matrix.secure_boot }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vm-binaries
          path: vm-bin
      - run: chmod 755 vm-bin/*
      - name: Build disposable live test environment
        run: |
          set -euo pipefail
          docker build -t borea-vm-tools backend/tests/vm
          mkdir -p vm-work/keyrings
          printf '%s\n' BOREA_TEST_WORK > vm-work/.borea-test-workdir
          cp backend/tests/vm/init vm-work/test-init
          cp backend/tests/vm/borea-dhcp vm-work/borea-dhcp
          cp backend/dist/keys/*.gpg vm-work/keyrings/
          docker run --rm \
            --mount type=bind,src="$PWD/vm-work",dst=/work \
            --mount type=bind,src="$PWD/vm-bin",dst=/binaries,readonly \
            --mount type=bind,src="$PWD/backend/tests/vm",dst=/harness,readonly \
            borea-vm-tools /bin/sh /harness/build-initrd.sh
      - name: Install, then boot the selected upstream system
        run: |
          set -euo pipefail
          kvm_args=()
          # Docker's root user opens this device; runner-user file modes do not
          # determine its availability inside the explicitly permitted guest.
          if [ -c /dev/kvm ]; then kvm_args=(--device /dev/kvm); fi
          docker run --rm "${kvm_args[@]}" \
            --mount type=bind,src="$PWD/vm-work",dst=/work \
            --mount type=bind,src="$PWD/vm-bin",dst=/binaries,readonly \
            --mount type=bind,src=/etc/ssl/certs/ca-certificates.crt,dst=/run/borea-ca.pem,readonly \
            -e BOREA_TEST_DISTRO -e BOREA_TEST_LAYOUT -e BOREA_TEST_SECURE_BOOT \
            borea-vm-tools /bin/sh -c '/binaries/borea-vm-runner install && /binaries/borea-vm-runner boot' \
            2>&1 | tee vm-console.log
      - name: Expose guest failures in the job annotations
        if: failure()
        run: |
          if [ -f vm-console.log ]; then
            failures=$(grep -E 'BOREA_TEST_ERROR|VM assertion failed|fatal error:|time limit' vm-console.log || tail -n 8 vm-console.log)
            failures=${failures//%/%25}
            failures=${failures//$'\r'/%0D}
            failures=${failures//$'\n'/%0A}
            echo "::error::$failures"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-${{ matrix.distro }}-${{ matrix.layout }}-sb${{ matrix.secure_boot }}
          path: |
            vm-console.log
            vm-work/scenario
            vm-work/cpio.log
          retention-days: 14
