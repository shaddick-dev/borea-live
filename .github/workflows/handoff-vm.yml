name: Hand-off to Omarchy in a VM
# Borea Live as a hub, end to end: boot a Borea stick (composed ISO plus its
# BOREA_DATA partition) in a disposable UEFI VM, run `borea-cli handoff omarchy`
# for a whole disk and alongside a synthetic Windows, and require Omarchy's own
# installer system to start. Alongside must also leave Windows shrunk by
# exactly the requested size, consistent, with its data intact.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/borea-handoff/**
      - crates/borea-disk/**
      - crates/borea-installd/**
      - crates/borea-cli/**
      - crates/borea-build/**
      - live/**
      - tests/vm/**
      - .github/workflows/handoff-vm.yml
  push:
    branches: [main]
    paths:
      - crates/borea-handoff/**
      - crates/borea-disk/**
      - crates/borea-installd/**
      - crates/borea-cli/**
      - crates/borea-build/**
      - live/**
      - tests/vm/**
      - .github/workflows/handoff-vm.yml
permissions:
  contents: read
env:
  OMARCHY_ISO: omarchy-4.0.6.iso
jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/live/compose
          key: compose-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: compose-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Compose Borea Live
        # A failure is repeated as annotations, readable without the full log.
        run: |
          set -o pipefail
          cargo run --locked --profile app -p borea-build -- compose 2>&1 | tee compose.log \
            || { sed 's/\x1b\[[0-9;]*m//g' compose.log | grep -v '^\s*$' | tail -10 \
                   | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: borea-live-handoff-test
          path: target/live/out/borea-live-compose.iso
          compression-level: 0
          retention-days: 2

  handoff:
    name: handoff (${{ matrix.name }})
    needs: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Whole disk and alongside Windows share one VM host: one setup, one
          # download of Omarchy's ISO, both runs every time.
          # Whole: a stick with only the image; Borea adds its data partition
          # and downloads. Alongside: a synthetic Windows, shrunk and checked.
          - name: whole + alongside
            key: disks
            runs: |
              whole whole --plain-stick
              alongside alongside
          # All the way: Omarchy installs itself (unattended, test only), and on
          # its first start Borea's service adds the extras chosen here.
          - name: install
            key: install
            runs: |
              install whole --install --extras printing,flatpak --timeout 1200
    steps:
      - uses: actions/checkout@v4
      - name: Make room and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo mkdir -p /mnt/handoff && sudo chown "$USER" /mnt/handoff
          df -h / /mnt
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf ntfs-3g dosfstools e2fsprogs gpgv btrfs-progs openssl
      - uses: actions/download-artifact@v4
        with:
          name: borea-live-handoff-test
          path: /mnt/handoff/borea
      - name: Omarchy's ISO, checked as Borea checks it
        working-directory: /mnt/handoff
        run: |
          mkdir -p omarchy && cd omarchy
          for f in "$OMARCHY_ISO" "$OMARCHY_ISO.sha256" "$OMARCHY_ISO.sig"; do
            curl -fsSL --retry 3 -o "$f" "https://iso.omarchy.org/$f"
          done
          ls -l
          [ "$(cut -d' ' -f1 "$OMARCHY_ISO.sha256")" = "$(sha256sum "$OMARCHY_ISO" | cut -d' ' -f1)" ]
          gpgv --keyring "$GITHUB_WORKSPACE/backend/dist/keys/omarchy.gpg" "$OMARCHY_ISO.sig" "$OMARCHY_ISO"
      - name: Hand off (${{ matrix.name }})
        env:
          RUNS: ${{ matrix.runs }}
        run: |
          status=0
          while read -r name layout flags; do
            [ -n "$name" ] || continue
            echo "::group::Hand off ($name)"
            # shellcheck disable=SC2086 # flags are separate arguments
            python3 tests/vm/handoff_boot.py /mnt/handoff/borea/borea-live-compose.iso /mnt/handoff/omarchy \
              --layout "$layout" --name "$name" --work /mnt/handoff/work $flags \
              || { tr -d '\r' < "/mnt/handoff/work/handoff-$name/failure.txt" \
                     | head -9 | sed "s/^/::error::$name: /"; status=1; }
            # Keep the logs; free the disk images before the next run.
            rm -f /mnt/handoff/work/handoff-"$name"/*.img
            echo "::endgroup::"
          done <<< "$RUNS"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-${{ matrix.key }}-logs
          path: |
            /mnt/handoff/work/handoff-*/*.log
          retention-days: 7
