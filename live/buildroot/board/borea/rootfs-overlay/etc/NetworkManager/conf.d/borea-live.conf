[main]
dns=systemd-resolved

[device]
# Scan with a random address, as most installers and phones do.
wifi.scan-rand-mac-address=yes

[connectivity]
# Lets the installer tell "associated" from "online", and spot captive portals.
uri=http://nmcheck.gnome.org/check_network_status.txt
response=NetworkManager is online
interval=60
