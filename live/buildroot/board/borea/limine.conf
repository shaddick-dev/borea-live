timeout: 3
interface_branding: Borea Live
interface_branding_colour: a2c4a8
term_background: 191f1c
term_foreground: e6ecdf

/Borea Live
    comment: Start the Borea installer.
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.img
    cmdline: console=tty0 loglevel=4 systemd.show_status=yes vt.global_cursor_default=0

/Borea Live (safe graphics)
    comment: Software rendering, for graphics that misbehave.
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.img
    cmdline: console=tty0 nomodeset loglevel=4 systemd.show_status=yes borea.safe-graphics

/Borea Live (diagnostic console)
    comment: Show boot messages and start a console instead of the graphical installer.
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.img
    cmdline: console=tty0 console=ttyS0,115200 loglevel=7 systemd.show_status=yes systemd.unit=multi-user.target
