[workspace]
resolver = "3"
members = ["crates/*", "backend/tests/vm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Live/GUI crates: eframe/egui 0.37 need 1.95. Installer backend crates pin 1.85 in their own manifests.
rust-version = "1.95"
publish = false

[workspace.dependencies]
borea-live-core = { path = "crates/borea-live-core" }
borea-live-catalog = { path = "crates/borea-live-catalog" }
borea-host = { path = "crates/borea-host" }
borea-hardware = { path = "crates/borea-hardware" }
borea-distro = { path = "crates/borea-distro" }
borea-testkit = { path = "crates/borea-testkit" }
borea-network = { path = "crates/borea-network" }
# Installer backend (borea-installd and its libraries)
borea-core = { path = "crates/borea-core" }
borea-catalog = { path = "crates/borea-catalog" }
borea-locale = { path = "crates/borea-locale" }
borea-net = { path = "crates/borea-net" }
borea-disk = { path = "crates/borea-disk" }
borea-backend = { path = "crates/borea-backend" }
borea-job = { path = "crates/borea-job" }
borea-exec = { path = "crates/borea-exec" }
borea-http = { path = "crates/borea-http" }
borea-platform = { path = "crates/borea-platform" }
borea-protocol = { path = "crates/borea-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
# Pinned: newer zbus needs Rust 1.87, above the backend MSRV.
zbus = { version = "=5.5.0", default-features = false, features = ["blocking-api", "async-io"] }
rpassword = "7"
serde_json = { version = "1.0", features = ["raw_value"] }
zeroize = "1.8"
sha2 = "0.10.9"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
nix = { version = "0.31", features = ["user", "socket", "mount", "sched", "fs", "signal"] }
rustix = { version = "1.1", features = ["process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true

# For installing borea-rataTUI from a checkout: optimised, but without the
# release profile's whole-program LTO, so it builds in a fraction of the time
# and rebuilds after a change in seconds. Releases still ship `release` builds.
[profile.app]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
# Light optimisation for libraries, whose speed doesn't matter in a USB writer
# (a few D-Bus calls, TLS on ring's assembly crypto, drawing a terminal)...
opt-level = 1

# ...and full optimisation where it does: hashing the image, and the writer.
[profile.app.package.sha2]
opt-level = 3
[profile.app.package.borea-flash]
opt-level = 3
