<html lang="en">

  <title>Borea installer walkthrough</title>
  <style>
    :root { color-scheme:dark; background:#2e3440; color:#eceff4; font:16px/1.5 system-ui,sans-serif; }

    p { color:#d8dee9; }
    a { color:#88c0d0; }
