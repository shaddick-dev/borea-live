# Windpad catalog: the families, distributions, and editions Borea offers.
#
# This is development research data, reviewed 2026-10-22 against the official
# sources listed per distribution. It is NOT the signed production catalog:
# the loader refuses to mark any entry "supported" while `signed = false`.
# Edition availability changes upstream; production menus come from signed,
# reviewed metadata and actual published combinations.
#
# `composable = true` marks an edition with no preinstalled desktop environment or
# shell. Only those editions offer the compositor + shell path from shells.toml.
#
# Naming, the same on every card:
#   - Distributions use their upstream product name ("openSUSE Tumbleweed").
#   - Editions are named for the desktop you get, then upstream's own label after
#     " · " when it adds something ("GNOME · Workstation", "KDE Plasma · Handheld").
#   - The edition with no desktop is always "Minimal".
#   - A ready-made desktop comes first in the menu; no entry is preselected. Minimal,
#     where you compose your own, comes last.
#
# Optional features (Gaming, Media codecs, Flatpak, Printing) are in extras.toml.

schema = 1
reviewed = "2026-10-22"
signed = false

# ── Arch family ──────────────────────────────────────────────────────────────

[[distro]]
id = "arch"
name = "Arch Linux"
family = "arch"
channel = "rolling"
status = "planned"
summary = "Current repositories, your choice of environment."
source = "https://archlinux.org/download/"
editions = [
  { id = "kde-plasma", name = "KDE Plasma" },
  { id = "gnome", name = "GNOME" },
  { id = "xfce", name = "Xfce" },
  { id = "minimal", name = "Minimal", composable = true },
]

[[distro]]
id = "cachyos"
name = "CachyOS"
family = "arch"
channel = "rolling"
status = "planned"
summary = "Both official editions, or Minimal to compose your own. Optimized repositories for this CPU."
source = "https://www.cachyos.org/download/"
editions = [
  # Upstream's "Desktop" edition; KDE Plasma is its default desktop.
  { id = "desktop", name = "KDE Plasma" },
  { id = "handheld", name = "KDE Plasma · Handheld", device = "handheld" },
  # Upstream's installer calls this "No Desktop": the optimized base, no desktop or shell.
  { id = "minimal", name = "Minimal", composable = true },
]

[[distro]]
id = "omarchy"
name = "Omarchy"
family = "arch"
channel = "stable"
status = "planned"
summary = "The upstream Omarchy experience, with its required layout and defaults."
source = "https://omarchy.org/manual/getting-started/"
editions = [{ id = "omarchy", name = "Hyprland · Omarchy" }]

