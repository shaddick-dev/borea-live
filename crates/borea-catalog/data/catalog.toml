summary = "Native image deployment with upstream updates and rollback."
source = "https://docs.bazzite.gg/General/Installation_Guide/install-guide/"
# The complete hardware/GPU/device matrix must come from reviewed upstream
# metadata; these are the desktop × mode choices only.
matrix_complete = false
editions = [
  { id = "desktop-kde", name = "KDE Plasma" },
  { id = "desktop-gnome", name = "GNOME" },
  { id = "gaming-mode-kde", name = "KDE Plasma · Gaming Mode" },
  { id = "gaming-mode-gnome", name = "GNOME · Gaming Mode" },
]

[[distro]]
id = "nobara"
name = "Nobara"
family = "fedora"
channel = "stable"
status = "planned"
summary = "All five current editions. Unified images cover standard and NVIDIA setups."
source = "https://nobaraproject.org/download.html"
editions = [
  # Upstream's "Official" edition: KDE Plasma with Nobara's own layout.
  { id = "official", name = "KDE Plasma · Official" },
  { id = "gnome", name = "GNOME" },
  { id = "kde", name = "KDE Plasma" },
  { id = "steam-htpc", name = "KDE Plasma · Steam HTPC" },
  { id = "steam-handheld", name = "KDE Plasma · Steam Handheld", device = "handheld" },
]

