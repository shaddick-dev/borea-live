summary = "Latest general-availability release with current updates."
source = "https://fedoraproject.org/"
editions = [
  { id = "workstation", name = "GNOME · Workstation" },
  { id = "kde-plasma", name = "KDE Plasma" },
  { id = "minimal", name = "Minimal", composable = true },
]

[[distro]]
id = "bazzite"
name = "Bazzite"
family = "fedora"
channel = "image-stream"
