[package]
name = "borea-gui"
description = "Borea and Windpad: a Rust Iced installer frontend"
license = "GPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "windpad"
path = "src/main.rs"

[[bin]]
name = "borea-live"
path = "src/live_main.rs"

[dependencies]
borea-live-core.workspace = true
borea-live-catalog.workspace = true
borea-distro.workspace = true
borea-hardware.workspace = true
borea-host.workspace = true
borea-network.workspace = true
borea-net.workspace = true
zbus.workspace = true
borea-protocol.workspace = true
borea-core.workspace = true
borea-catalog.workspace = true
borea-locale.workspace = true
zeroize.workspace = true
serde_json = "1"
serde.workspace = true
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "canvas", "svg", "image-without-codecs", "advanced", "tokio", "x11", "wayland"] }
iced_tiny_skia = { version = "0.14", features = ["image", "svg", "geometry"] }
image = { version = "0.25", default-features = false, features = ["png"] }
iced_runtime = "0.14"
tiny-skia = "0.11"

[lints.rust]
unsafe_code = "forbid"
