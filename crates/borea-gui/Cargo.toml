[package]
name = "borea-gui"
description = "Borea and Windpad: a shared Slint installer frontend"
license = "GPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "windpad"
path = "src/main.rs"

[[bin]]
name = "borea-live"
path = "src/live_main.rs"

[dependencies]
borea-live-core.workspace = true
borea-live-catalog.workspace = true
borea-distro.workspace = true
borea-hardware.workspace = true
borea-host.workspace = true
borea-network.workspace = true
zbus.workspace = true
borea-protocol.workspace = true
borea-core.workspace = true
borea-catalog.workspace = true
borea-locale.workspace = true
zeroize.workspace = true
serde_json = "1"
serde.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
slint = { version = "=1.11.0", default-features = false, features = ["std", "backend-winit-wayland", "backend-winit-x11", "renderer-software", "accessibility", "compat-1-2"] }
png = "0.18"

[build-dependencies]
slint-build = "=1.11.0"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }

[lints.rust]
# Slint generated bindings locally allow unsafe; application code denies it.
unsafe_code = "deny"
