# Compose your desktop: compositors and shells for editions that ship without one.
#
# Only editions marked `composable = true` in catalog.toml (no preinstalled desktop
# environment or shell) offer this path. Every other edition keeps its upstream
# desktop untouched, which avoids two shells fighting over one session.
#
# Research reviewed 2026-10-22 against each project's README and the distributions'
# package indexes (archlinux.org, AUR RPC, Fedora mdapi/Bodhi, Debian madison,
# Repology, and CachyOS's mirror). CachyOS builds on Arch's repositories, so every
# Arch source applies there too. Shells are listed in order of GitHub stars observed that day. Windpad
# suggests, in order: a shell made for this distribution (`made_for`), else the
# first official package, else the first offer.
#
# Sources, from most to least integrated:
#   official     – the distribution's own repositories; installed with the target
#   third-party  – a named external repository, disclosed in review before approval
#   aur          – Arch User Repository; built as the user at first login, never as root
#   first-login  – the project's own installer, run as the user at first login,
#                  pinned to a reviewed revision and shown in review
# A distribution missing from `on` cannot offer that compositor or shell.

schema = 1
reviewed = "2026-10-22"

# ── Compositors ──────────────────────────────────────────────────────────────

[[compositor]]
id = "hyprland"
name = "Hyprland"
style = "Dynamic tiling, fluid animations"
license = "BSD-3-Clause"
source = "https://github.com/hyprwm/Hyprland"
on.arch = { via = "official", packages = ["hyprland"] }
on.cachyos = { via = "official", packages = ["hyprland"] }
# Fedora retired its own package after F42; the maintained build lives in COPR.
on.fedora = { via = "third-party", packages = ["hyprland"], repository = "COPR solopasha/hyprland" }
on.debian = { via = "official", packages = ["hyprland"], suite = "trixie-backports" }
on.tumbleweed = { via = "official", packages = ["hyprland"] }

[[compositor]]
id = "niri"
name = "niri"
style = "Scrollable columns, calm and spatial"
license = "GPL-3.0"
source = "https://github.com/niri-wm/niri"
on.arch = { via = "official", packages = ["niri"] }
on.cachyos = { via = "official", packages = ["niri"] }
on.fedora = { via = "official", packages = ["niri"] }
on.tumbleweed = { via = "official", packages = ["niri"] }
# Not packaged for Debian stable.

[[compositor]]
id = "mango"
name = "MangoWC"
style = "dwm's tags with smooth animation"
license = "GPL-3.0"
source = "https://github.com/mangowm/mango"
on.arch = { via = "official", packages = ["mangowm"] }
on.cachyos = { via = "official", packages = ["mangowm"] }
on.fedora = { via = "third-party", packages = ["mangowm"], repository = "Terra" }
# JustAGuy Linux's signed butterrepo carries the 0.14 series, the last for trixie,
# with wlroots 0.19 and scenefx installed beside Debian's own libraries.
on.debian = { via = "third-party", packages = ["mangowc"], repository = "butterrepo (apt.justaguy.dev)" }
# Not packaged for Tumbleweed.

